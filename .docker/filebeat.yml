
setup.template.name: "otel-logs"
setup.template.pattern: "otel-logs*"
filebeat.inputs:
  - type: filestream
    id: docker-filestream
    enabled: true
    paths:
      - /var/lib/docker/containers/*/*.log
    processors:
      - add_docker_metadata: ~

output.elasticsearch:
  hosts: ["elasticsearch:9200"]
  index: "otel-logs"

setup.kibana:
  host: "kibana:5601"

logging:
  level: info
