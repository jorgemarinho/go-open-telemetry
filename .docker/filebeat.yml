
filebeat.inputs:
  - type: container
    enabled: true
    paths:
      - /var/lib/docker/containers/*/*.log
    processors:
      - add_docker_metadata: ~

output.elasticsearch:
  hosts: ["elasticsearch:9200"]
  indices:
    - index: "otel-logs"
      when.contains:
        log_type: "otel"

setup.kibana:
  host: "kibana:5601"

logging:
  level: info
