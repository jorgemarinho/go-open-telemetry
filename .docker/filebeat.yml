
setup.template.name: "otel-logs"
setup.template.pattern: "otel-logs*"
filebeat.inputs:
  - type: filestream
    id: docker-filestream
    enabled: true
    paths:
    - /var/lib/docker/containers/*/*.log
    - /var/lib/docker/containers/otel-collector/otel-logs.json
    processors:
      - decode_json_fields:
          fields: ["message"]
          target: ""
          overwrite_keys: true
      - add_docker_metadata: ~
      - drop_event:
          when:
            not:
              regexp:
                log: '.*[Ee]rro.*'

output.elasticsearch:
  hosts: ["elasticsearch:9200"]
  index: "otel-logs"

setup.kibana:
  host: "kibana:5601"

logging:
  level: info
